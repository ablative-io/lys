suite = "v1"

[clippy]
  on = ["mac", "linux"]

[docs]
  on = ["mac", "linux"]

[go-test-cose-conformance]
  dir = "crates/lys-core/tests/cose-conformance"
  kind = "go-test"
  slow = "60s"

[go-test-go-conformance]
  dir = "crates/lys-core/tests/go-conformance"
  kind = "go-test"
  slow = "60s"

[go-vet-cose-conformance]
  dir = "crates/lys-core/tests/cose-conformance"
  kind = "go-vet"

[go-vet-go-conformance]
  dir = "crates/lys-core/tests/go-conformance"
  kind = "go-vet"

[nextest]
  on = ["mac", "linux"]
  slow = "60s"

[portable]
  kind = "ast-grep"
  rules = "portable"

[pytest]
  slow = "60s"

[tsc-surface-identity]
  dir = "surface/identity"
  kind = "tsc"

[vitest-surface-identity]
  dir = "surface/identity"
  kind = "vitest"
  slow = "60s"
