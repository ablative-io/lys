# The identity deployment configuration `lys identity prepare`, `configure` and
# `health` read. Copy it beside the venue you choose and edit the addresses.
# It carries no secret: prepare generates every secret into the venue directory
# with a restricted mode, and never prints one.

# Where prepare writes the private files the three services read. Absolute, or
# relative to this file. It is never committed.
venue = "./venue"

[database]
# The PostgreSQL service the one identity database lives on. Any host: the
# compose file's own `postgres` service (start it with the local-db profile),
# or a network device. No local address is substituted when this one is
# unreachable: health names it as unready.
host = "postgres"
port = 5432
name = "identity"
# The administrative role PostgreSQL's own init runs as. Its password, and the
# rauthy and spicedb role passwords, are generated by prepare.
admin_role = "identity_admin"

[rauthy]
# How a browser reaches Rauthy. The scheme and the public URL are what Rauthy
# writes into its issuer and every redirect, so they must be the origin the
# operator serves it on: plain http on the local host in development, https
# behind a TLS origin elsewhere.
scheme = "http"
public_url = "localhost:18080"
# The WebAuthn relying party: the host of public_url, and its full origin.
rp_id = "localhost"
rp_origin = "http://localhost:18080"
# The first administrator. The password is generated by prepare.
admin_email = "admin@localhost"

[spicedb]
# SpiceDB's gRPC and HTTP ports as the operator publishes them. In step 1
# SpiceDB is asked for no permission decision; health reads its readiness only.
grpc_port = 15051
http_port = 18443

[ports]
# The host ports the compose file publishes. They avoid the estate's own
# listeners on this Mac (Aion holds 50051; something holds 8080).
postgres = 15432
rauthy = 18080

[clients]
# The two OIDC clients configure registers on Rauthy, each with its exact
# redirect URIs and its own theme. Cambium's verifier requires RS256; the
# platform's own confidential client uses S256.
[clients.platform]
id = "lys-platform"
redirect_uris = ["http://localhost:18090/auth/callback"]

[clients.cambium]
id = "cambium"
redirect_uris = ["http://localhost:6010/auth/callback"]
