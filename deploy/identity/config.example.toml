# deploy/identity/config.example.toml
#
# Deployment configuration for the standalone identity product's development
# install, read by `lys identity prepare`, `configure` and `health`. Copy it
# outside the repository, adjust it, and pass its path with --config. It holds
# no secret: prepare generates every credential into state_dir.
#
# Relative paths in this file are relative to the directory holding the file.

[deployment]
# The compose project name; it prefixes the containers and the durable volumes.
compose_project = "lys-identity"
# Where prepare writes the private env file and the generated credentials, each
# mode 0600 in a 0700 directory. prepare refuses a state_dir inside a Git work
# tree, so generated credentials never sit where they could be committed.
state_dir = "state"

[database]
# The PostgreSQL host Rauthy and SpiceDB connect to (ADR-005). The value
# "postgres" names deploy/identity/compose.yaml's own PostgreSQL service, which
# then runs under the local-database profile. Any other value is an external
# PostgreSQL, for example on a network device, prepared once with
# deploy/identity/postgres-init.sql; the local service is then never started,
# and nothing falls back to it when that host does not answer.
host = "postgres"
port = 5432
name = "identity"
# TLS to the database: "disable" or "require". Use "require" for a database on
# another device.
tls = "disable"
# Where the local PostgreSQL service is published on this node, and where
# `lys identity health` reaches it. Read only when the host is the local service; for an
# external database health probes host:port.
local_publish = "127.0.0.1:55432"

[rauthy]
# The issuer origin. Rauthy's issuer is this origin followed by /auth/v1/.
# Local origin (development, loopback only):
public_origin = "http://localhost:8080"
# TLS origin: set public_origin to the https origin a reverse proxy terminates
# TLS for, for example "https://identity.example.test", and list the proxy's
# address in trusted_proxies. An http origin is accepted only on a loopback
# host.
trusted_proxies = []
# Where Rauthy's listener is published on this node; configure and health
# reach Rauthy here.
publish = "127.0.0.1:8080"
# The bootstrap administrator's address: a disposable test identity only.
admin_email = "admin@identity.test"

[spicedb]
# Where SpiceDB's HTTP gateway (readiness) and gRPC API are published.
http_publish = "127.0.0.1:8443"
grpc_publish = "127.0.0.1:50051"

# The two clients configure manages, beside the built-in `rauthy` client that
# Rauthy's own migration inserts and that configure never touches. Both are
# confidential authorization-code clients with exact redirect URIs.

[clients.platform]
id = "platform"
name = "Identity Platform"
redirect_uris = ["http://localhost:3000/auth/callback"]
post_logout_redirect_uris = ["http://localhost:3000/"]
# Token signing algorithm, RS256 or EdDSA.
signing_alg = "RS256"
# The platform's own confidential client requires PKCE S256.
pkce_s256 = true

[clients.cambium]
id = "cambium"
name = "Cambium"
redirect_uris = ["http://localhost:4000/auth/callback"]
post_logout_redirect_uris = ["http://localhost:4000/"]
# RS256, which the Cambium verifier requires.
signing_alg = "RS256"
# Cambium's S256 is a separately conditional addition in row 06.
pkce_s256 = false
