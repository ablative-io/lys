# deploy/identity/config.example.toml
#
# The deployment configuration `lys identity prepare`, `configure` and `health` read
# (DIRECTORY-002 R1, R2). Copy it outside the repository, set every value for the
# node you name, and run from the repository root:
#
#   lys identity prepare   --config <your copy>
#   docker compose -f deploy/identity/compose.yaml -p <deployment.project> \
#     --env-file <private_dir>/identity.env [--profile database] up -d
#   lys identity health    --config <your copy>
#   lys identity configure --config <your copy> --themes deploy/identity/rauthy-themes.json
#
# This file holds no secret. Every credential is generated by `prepare` into the
# private directory, owner-only, and is reused on every later run.
#
# The CLI reads this file as TOML. An unknown key, a missing key or a value of the
# wrong type is refused by name (config_invalid); nothing is defaulted.

[deployment]
# The node this development instance is installed on, as the operator names it
# (ADR-005). Recorded in the rendered environment and the deployment report.
node = "dev-node"
# Compose project name: prefixes the containers and the durable volumes.
project = "lys-identity"
# Where `prepare` writes the generated credentials and identity.env. Relative to
# the directory holding this file. Keep it out of Git.
private_dir = "private"

[database]
# Where the one PostgreSQL database lives (ADR-005). This is configuration and is
# never assumed to be this machine: it may be a network device. Rauthy, SpiceDB and
# `lys identity health` all dial this address, so give one that both the containers
# and this host reach. A loopback name is refused, because inside a container it
# names the container itself.
host = "db.example.net"
port = 5432
# The one database both services use, each in its own schema.
name = "identity"
# The bootstrap superuser PostgreSQL's init directory runs postgres-init.sql as.
admin_user = "identity_admin"
# One of disable, prefer, require. Use require when the database is on another
# device; disable is for a database on the compose network of this node only.
sslmode = "require"
# Only when the `database` compose profile runs PostgreSQL on this node: the host
# port it is published on. The address above must then reach this port.
publish = "5432"

[rauthy]
# The origin people's browsers use; the issuer is this origin + /auth/v1/.
#   Local:  "http://localhost:8080"  (plain http is accepted only on loopback)
#   TLS:    "https://id.example.net" (TLS terminates in a proxy in front of Rauthy;
#           trusted_proxy below must then name the proxy's network)
public_origin = "http://localhost:8080"
# The CIDR of the TLS-terminating proxy for an https origin; empty for a local
# http origin.
trusted_proxy = ""
# Where this CLI reaches Rauthy's API and health endpoints on the node. Plain http
# to the node-local listener; never the public TLS origin.
admin_origin = "http://127.0.0.1:8080"
# The host address Rauthy's listener is published on.
publish = "127.0.0.1:8080"
# The bootstrap administrator: a disposable test identity during rows 02 to 05
# (CN2). Its password is generated by `prepare`.
admin_email = "admin@example.net"

[spicedb]
# Health reads SpiceDB's readiness here; nothing asks SpiceDB for a permission
# decision in step 1 (deploy/identity/README.md).
http_origin = "http://127.0.0.1:8443"
http_publish = "127.0.0.1:8443"
grpc_publish = "127.0.0.1:50051"

[clients.platform]
# The platform's own confidential OIDC client, with S256 as revision 5 proposes.
id = "platform"
name = "Platform"
redirect_uris = ["http://localhost:8081/auth/callback"]
post_logout_redirect_uris = ["http://localhost:8081/"]
signing_alg = "RS256"
challenges = ["S256"]

[clients.cambium]
# Cambium's confidential OIDC client, RS256 where the Cambium verifier requires
# it. S256 for Cambium is a separately conditional addition in row 06.
id = "cambium"
name = "Cambium"
redirect_uris = ["http://localhost:8082/auth/callback"]
post_logout_redirect_uris = ["http://localhost:8082/"]
signing_alg = "RS256"
challenges = []
