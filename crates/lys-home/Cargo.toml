[package]
name = "lys-home"
description = "The home: a session held under its identity as a Pi-shaped session tree, with content blocks by hash and proxy call records; harness importers and renderers sit beside it."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version = "1.89" # std::fs::File::try_lock, the one-owner lock on a session file
keywords = ["session", "transcript", "tree", "home", "agent"]
categories = ["database-implementations"]

[dependencies]
clap.workspace = true
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
# The little proxy's transport (HOME-001 R7, R10): HTTP/1 over rustls with
# ring and the Mozilla roots, each pinned at the version already in the lock.
http-body-util = "=0.1.5"
hyper = { version = "=1.11.1", features = ["client", "http1", "server"] }
hyper-rustls = { version = "=0.27.10", default-features = false, features = ["http1", "ring", "tls12", "webpki-tokio"] }
hyper-util = { version = "=0.1.21", features = ["client-legacy", "http1", "tokio"] }
jiff.workspace = true
lys-core.workspace = true
rand.workspace = true
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
serde.workspace = true
serde_json.workspace = true
sha1.workspace = true
sha2.workspace = true
thiserror.workspace = true
time = { workspace = true, features = ["formatting", "parsing"] }
tokio = { workspace = true, features = ["io-util"] }

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[[bin]]
name = "lys-home"
path = "src/main.rs"

[[bin]]
name = "lys-proxy"
path = "src/bin/lys-proxy.rs"

[dev-dependencies]
tempfile.workspace = true
toml.workspace = true

[lints]
workspace = true
