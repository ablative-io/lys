[package]
name = "lys-anchor"
description = "A lys transparency anchor: an append-only log with a genesis leaf, over any LeafStore."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

# Never published, and this is a mechanical guard rather than a formality.
# Publishing a crate that exposes a wire format is one of the two things that
# FREEZES that format (crates/lys-core/Cargo.toml). This crate is where the
# draft anchor formats will be built, so it stays unpublishable until the
# operator's ratify-then-publish sequence completes.
publish = false

[features]
default = []

# Forwards `lys-core`'s draft-format gate. OFF BY DEFAULT, and the shape below
# — a forwarding feature rather than an unconditional dependency edge — was
# chosen from a measurement, not from taste.
#
# The submit path needs `lys_core::receipt`, which lives behind
# `lys-core/unstable-anchor`. The obvious way to reach it is to write the edge
# into the dependency itself:
#
#     lys-core = { workspace = true, features = ["unstable-anchor"] }
#
# That was tried and measured. Cargo unifies features across the whole
# workspace build, so an edge here turns the draft-format gate on for
# `lys-core` in EVERY build that happens to include this crate — including the
# default one. On the tree this feature was added to, `cargo test --workspace`
# went from **548 passing to 646** — exactly its own `--all-features` count —
# and the 98-test gap between the two runs collapsed to zero. The default run
# would have stayed green while no longer proving anything about the shape
# consumers actually get, which is the silent coverage loss CLAUDE.md refuses
# everywhere else.
#
# As a forwarding feature the gate stays a decision made at the top of the
# build: `--all-features` turns it on and runs the receipt gates, and the
# default run still compiles this crate with the receipt path absent. That is
# also the honest shape — the draft formats are not ratified, so a build that
# did not ask for them should not get them.
unstable-anchor = ["lys-core/unstable-anchor"]

# The witness surface: recording another log's checkpoint and reporting what
# this anchor's own memory makes of it. OFF BY DEFAULT, which is the shape the
# design asks for rather than a hedge — a single anchor with zero witnesses,
# pinning to no one, must be fully functional, so the build the default gate
# exercises should be that one. With the feature off, `witness/` does not exist
# and no core path can name anything in it; the compiler is the second party for
# that claim, on the only axis the claim is made on, which is reachability.
#
# It implies `unstable-anchor` because it is built out of it: an `Observation`
# carries a `SubmissionOutcome`, and a witness receipt is the receipt the core
# submit path issues. That implication is what makes a bare
# `--features federation` build meaningful, and it is a one-way edge — nothing
# in `unstable-anchor` reaches back.
federation = ["unstable-anchor"]

[dependencies]
# Default features only — see [features] above for the measurement that says
# why `unstable-anchor` is forwarded from this crate instead of being enabled
# on this edge.
lys-core.workspace = true
lys-log-store.workspace = true
thiserror.workspace = true

[dev-dependencies]
# A base64 codec the tests drive themselves, so what a bundle carries can be
# read back by something other than the encoder that wrote it. A
# dev-dependency: nothing in this crate's own code encodes base64, because the
# container's encodings are `lys-core`'s and a second copy of a canonical
# encoder is what a suite testing only itself can never catch drifting.
base64.workspace = true
# The JSON codec for the proof artifact. A dev-dependency and not a dependency:
# `lys-core` deliberately performs no JSON (de)serialization itself — the types
# only derive `Serialize`/`Deserialize` and the consumer picks the codec — and
# this crate makes the same choice. Only the tests need one, to exercise the
# artifact's serialized shape.
serde_json.workspace = true
# A SHA-256 the tests drive themselves, so a leaf hash can be checked against
# something other than the helper that produced it.
sha2.workspace = true
tempfile.workspace = true

[lints]
workspace = true
