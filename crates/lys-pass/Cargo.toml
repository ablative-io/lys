[package]
name = "lys-pass"
description = "Lys pass verification, live permission checks and product draft execution"
version = "0.4.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
base64.workspace = true
ed25519-dalek.workspace = true
# The one way Lys builds an HTTP client, re-exported as `lys_pass::http` so a
# product builds the client it hands lys-pass with Lys's TLS.
lys-http = { workspace = true, optional = true }
reqwest = { workspace = true, features = ["json", "form"], optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
url.workspace = true
utoipa = { workspace = true, optional = true }

[features]
# Derive the OpenAPI schemas of the shared contracts, for the Lys server
# that serves them; products need not take utoipa.
openapi = ["dep:utoipa"]
# The live client (keyset fetch, token exchange, deliberate checks, drafts) and
# the sign-in flow ask Lys over HTTP through reqwest, so hyper; the client is
# built through lys-http (rustls on ring, the bundled webpki-roots), which the
# feature brings and re-exports. Off by default: a product that verifies
# passes against keys from its configuration takes lys-pass without an HTTP
# stack in its graph.
http = ["dep:reqwest", "dep:lys-http"]

[dev-dependencies]
# The crate's own tests exercise the live client, so they build it with HTTP.
lys-pass = { path = ".", features = ["http"] }
tokio = { workspace = true, features = ["io-util"] }

[lints]
workspace = true
