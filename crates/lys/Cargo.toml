[package]
name = "lys"
description = "Cryptographic trust infrastructure for AI agents — CLI for identity, attestation, transparency logs, and verification."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version = "1.87" # process-wrap, the new session the login shell read starts in
readme = "../../README.md"
keywords = ["cryptography", "transparency", "agents", "audit", "cli"]
categories = ["cryptography", "command-line-utilities"]

[[bin]]
name = "lys"
path = "src/main.rs"

[features]
default = []
clock-fixture = []

[[example]]
name = "clock-cli"
path = "examples/clock-cli.rs"
required-features = ["clock-fixture"]
test = false

[dependencies]
url.workspace = true
lys-core.workspace = true
lys-log-store.workspace = true
lys-identity.workspace = true
# `lys runner`: every act of the runner is the library's.
lys-runner.workspace = true
# `lys proxy`: every act of the model proxy is the library's.
lys-home.workspace = true
base64.workspace = true
chrono.workspace = true
clap.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
# Typed deployment configuration for `lys identity`, read from TOML.
toml.workspace = true
# `lys proxy serve` runs the proxy's forwarding on its own runtime.
tokio.workspace = true
# Read-only X.509 field extraction for `lys inspect cert`; verification stays
# in lys-core, which speaks DER and owns every trust decision.
x509-parser.workspace = true
# Generated deployment credentials are wiped from memory when dropped.
zeroize.workspace = true
# `lys mcp` over https (AGENTS-015 R3): the rustls lys-home and lys-runner already
# carry, pinned the same, with ring; verification is rustls-webpki's, never off.
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
# The system's trust roots for that check, read once from the platform store: the
# root loader of the rustls project, a source of roots for the present stack, not a
# TLS stack of its own.
rustls-native-certs = "=0.8.4"

# `lys identity install` waits on events: a service's log through kqueue or
# inotify, and its exit through the release of the lock it holds.
[target.'cfg(unix)'.dependencies]
mio.workspace = true
rustix = { workspace = true, features = ["termios"] }
# The login shell `lys identity install` reads PATH from runs in a new session.
process-wrap.workspace = true

[dev-dependencies]
tempfile.workspace = true
# `lys agent enrol` is proved against the fixture identity server (AGENTS-017 R1).
identity-contract = { path = "../../tests/identity_contract" }
lys-identity-server.workspace = true
# The https bridge test issues its own root and server certificate (AGENTS-015 R3).
rcgen.workspace = true
# The mail leg makes an account at the pinned issuer over HTTP (DIRECTORY-110 R2).
reqwest = { workspace = true, features = ["json", "rustls-tls"] }

[target.'cfg(unix)'.dev-dependencies]
nix = { version = "0.28", features = ["event", "fs", "time", "user"] }

# The container-backed identity targets run only on the identity leg of
# .land/gates.sh, never under `cargo test --workspace --all-features`.
[[test]]
name = "identity_deploy"
path = "tests/identity_deploy.rs"
test = false

[[test]]
name = "identity_refusals"
path = "tests/identity_refusals.rs"
test = false

[[test]]
name = "identity_shared_db"
path = "tests/identity_shared_db.rs"
test = false

[[test]]
name = "identity_restart"
path = "tests/identity_restart.rs"
test = false

[[test]]
name = "identity_theme"
path = "tests/identity_theme.rs"
test = false

[[test]]
name = "identity_install"
path = "tests/identity_install.rs"
test = false

# The mail leg runs the pinned issuer image against a capturing sink; it
# needs Docker, so it runs only when named (DIRECTORY-110 R2).
[[test]]
name = "rauthy_mail_leg"
path = "tests/rauthy_mail_leg.rs"
test = false

[lints]
workspace = true
