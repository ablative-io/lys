# Written by `lys identity install`. Addresses, names and choices only; every
# credential lives in an owner-only file under state.

[deployment]
node = "this-machine"
project = "lys-identity"
state_dir = "state"
# The compose network's private range. Its gateway, 172.29.47.1, is the one
# address the directory service reaches the sign-in service from.
network = "172.29.47.0/24"
{{admin_email_line}}
[issuer]
# The sign-in service's public address is Lys's own origin: a browser only
# ever sees Lys, and a sign-in provider sends people back to Lys, which
# finishes the sign-in server-side. Lys reaches the service at admin_url.
public_origin = "http://localhost:{{service_port}}"
listen_port = {{rauthy_port}}
admin_url = "http://127.0.0.1:{{rauthy_port}}"
# The address the directory service reaches the sign-in service from, as the
# container sees it: the network's gateway. Only it may name a person's
# address in X-Forwarded-For.
trusted_proxies = ["172.29.47.1/32"]

[database]
bundled = true
host = "postgres"
port = 5432
name = "identity"
tls = "disable"
check_address = "127.0.0.1:55432"
publish_port = 55432

[spicedb]
grpc_port = 58051
http_port = 58443

[credentials]
source = "generate"

[clients.platform]
id = "lys-platform"
name = "Lys Identity"
redirect_uris = ["http://localhost:{{service_port}}/api/callback"]
post_logout_redirect_uris = ["http://localhost:{{service_port}}/"]
token_alg = "EdDSA"
challenges = ["S256"]
