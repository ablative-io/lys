[package]
name = "lys-identity-server"
description = "The lys directory service: OIDC sign-in, the configured administrator's admission, and the directory's HTTP API."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
zeroize.workspace = true
axum.workspace = true
base64.workspace = true
lys-core.workspace = true
lys-home.workspace = true
lys-identity.workspace = true
jiff = { workspace = true, features = ["tz-system"] }
lys-log-store.workspace = true
lys-openapi.workspace = true
lys-runner.workspace = true
openidconnect.workspace = true
rand.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tempfile.workspace = true
toml.workspace = true
tokio = { workspace = true, features = ["time"] }
tower.workspace = true
tracing.workspace = true
utoipa.workspace = true

[dev-dependencies]
allocation-counter = "=0.8.1"
lys-identity = { workspace = true, features = ["test-support"] }
lys-log-store = { workspace = true, features = ["flush-counts"] }
ciborium.workspace = true
identity-contract = { path = "../../tests/identity_contract" }
rustix.workspace = true
tempfile.workspace = true
toml.workspace = true

# The target that needs a running permission database runs only when it is
# named, never under `cargo test --workspace --all-features`.
[[test]]
name = "identity_spicedb"
path = "tests/identity_spicedb.rs"
test = false

[lints]
workspace = true
