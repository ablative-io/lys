[package]
autotests = false
name = "lys-runner"
description = "The lys runner: holds each started agent in its own background pseudo-terminal, driven over a published, signed protocol on a Unix socket."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
jiff = { workspace = true, features = ["tz-system"] }
lys-core.workspace = true
lys-home.workspace = true
# A session's stream file is followed by the platform's change notices,
# never by polling on a clock.
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
# A peer's process id and user are read from the connected socket.
nix = { version = "0.28", default-features = false, features = ["event", "fs", "inotify", "poll", "process", "socket", "user"] }
# Each session's pseudo-terminal: opening it, making it the child's
# controlling terminal and resizing it, behind a safe interface.
portable-pty.workspace = true
rand.workspace = true
# `wait` takes a regular expression only when the caller names one.
regex-lite.workspace = true
# Ending a session's whole process group, through a safe interface.
rustix = { workspace = true, features = ["net", "process"] }
# The dial bridge's TLS: rustls with ring and the Mozilla roots, each pinned
# at the version already in the lock, as lys-home pins them.
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
serde.workspace = true
sha2.workspace = true
serde_json.workspace = true
socket2 = { version = "=0.6.5", features = ["all"] }
thiserror.workspace = true
# `lys runner serve` ends every session when the process is asked to stop.
tokio = { workspace = true, features = ["rt", "signal", "macros", "net", "sync"] }
url = "2.5"
# The rotation's shape in the identity server's OpenAPI document.
utoipa.workspace = true
webpki-roots = "=1.0.9"

# A peer's ancestry is read from the macOS process records.
[target.'cfg(target_os = "macos")'.dependencies]
libproc = "0.14"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
axum.workspace = true
base64.workspace = true
identity-contract = { path = "../../tests/identity_contract" }
lys-identity.workspace = true
lys-identity-server.workspace = true
lys-secrets = { path = "../lys-secrets" }
rcgen.workspace = true
tempfile.workspace = true

