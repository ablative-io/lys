<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Identity: mock-up v4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Aion ops console tokens (apps/aion-ops-console/src/index.css), with the identity
   product's own accent in place of Aion's blue: #D4975A, deep #A86B2E, wash #3D2A17. */
:root {
  --radius-sm: .375rem; --radius-md: .5rem; --radius-lg: .625rem;
  --background: #121218;
  --surface-base: #0f0f14; --surface-default: #18181f; --surface-card: #1a1a22;
  --surface-hover: #252530; --surface-code: #0d0d12;
  --border-subtle: rgba(255,255,255,.04); --border-default: rgba(255,255,255,.08);
  --text-primary: #f4f4f5; --text-secondary: #a1a1aa; --text-muted: #71717a;
  --accent: #D4975A; --accent-deep: #A86B2E; --accent-wash: #3D2A17;
  --accent-glow: rgba(212,151,90,.12); --focus: rgba(212,151,90,.5);
  --ok: #74b584; --ok-glow: rgba(116,181,132,.12);
  --warn: #fbbf24; --warn-glow: rgba(251,191,36,.12);
  --danger: #f87171;
  --muted-dot: #71717a;
  --shadow-lg: 0 4px 8px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.35);
  --glass-bg: rgba(24,24,31,.9);
  --spring: cubic-bezier(.2,.9,.25,1.05);
  --rail: 48px; --rail-open: 196px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--background); color: var(--text-primary); font: 13px/1.6 "DM Sans", system-ui, sans-serif; -webkit-font-smoothing: antialiased; overflow: hidden; }
.mono { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 12px; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: var(--radius-sm); }

.shell { display: flex; height: 100vh; }
.shell.dock-right { flex-direction: row-reverse; }
.rail { width: var(--rail); flex: none; background: var(--surface-base); border-right: 1px solid var(--border-subtle); display: flex; flex-direction: column; padding: 12px 8px; gap: 2px; transition: width .32s var(--spring); overflow: hidden; }
.dock-right .rail { border-right: 0; border-left: 1px solid var(--border-subtle); }
.rail.open { width: var(--rail-open); }
.mark { height: 32px; display: flex; align-items: center; gap: 10px; padding: 0 7px; margin-bottom: 10px; font-weight: 600; font-size: 12px; white-space: nowrap; }
.mark .seal { width: 18px; height: 18px; flex: none; border: 1.5px solid var(--accent); border-radius: 50%; display: grid; place-items: center; font: 600 8px "JetBrains Mono"; color: var(--accent); }
.rail a, .rail button.rb { display: flex; align-items: center; gap: 12px; height: 32px; padding: 0 8px; border-radius: var(--radius-md); color: var(--text-muted); text-decoration: none; white-space: nowrap; position: relative; }
.rail a:hover, .rail button.rb:hover, .rail button.rb.on { color: var(--text-primary); background: var(--surface-hover); }
.rail a.on { color: var(--text-primary); background: var(--surface-hover); }
.rail a.on::before { content: ""; position: absolute; left: -8px; top: 8px; bottom: 8px; width: 2px; border-radius: 2px; background: var(--accent); }
.dock-right .rail a.on::before { left: auto; right: -8px; }
.rail svg { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.rail .lbl { opacity: 0; transition: opacity .15s; font-size: 12.5px; }
.rail.open .lbl { opacity: 1; transition-delay: .08s; }
.rail .grow { flex: 1; }
.rail .sep { height: 1px; background: var(--border-subtle); margin: 8px 4px; }
.kbd { font: 10px "JetBrains Mono"; color: var(--text-muted); border: 1px solid var(--border-default); border-radius: 4px; padding: 0 4px; margin-left: auto; }

.screen { flex: 1; overflow: auto; position: relative; }
.page { padding: 26px 32px 64px; max-width: 1400px; }
.eyebrow { font: 500 10px "JetBrains Mono"; letter-spacing: .15em; text-transform: uppercase; color: var(--text-muted); }
.eyebrow a { text-decoration: none; }
h1 { font-size: 20px; font-weight: 600; letter-spacing: -.02em; line-height: 1.2; margin: 6px 0 4px; }
h2 { font-size: 14px; font-weight: 600; letter-spacing: -.01em; margin: 0; }
.sub { color: var(--text-secondary); margin: 0 0 18px; }
.head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
.seg { display: inline-flex; background: var(--surface-default); border: 1px solid var(--border-default); border-radius: var(--radius-md); padding: 3px; gap: 2px; }
.seg button, .seg a { padding: 3px 10px; border-radius: var(--radius-sm); color: var(--text-muted); font-size: 12px; text-decoration: none; }
.seg .on { background: var(--surface-hover); color: var(--text-primary); }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: var(--radius-md); border: 1px solid var(--border-default); background: var(--surface-default); font-size: 12.5px; color: var(--text-primary); text-decoration: none; }
.btn:hover { background: var(--surface-hover); }
.btn.primary { background: var(--accent); color: #17110b; border-color: transparent; font-weight: 600; }
.btn.primary:hover { background: #e0a870; }
.btn.danger { color: var(--danger); border-color: rgba(248,113,113,.25); }

table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-weight: 500; color: var(--text-secondary); font-size: 12.5px; padding: 8px 10px; border-bottom: 1px solid var(--border-default); white-space: nowrap; }
td { padding: 8px 10px; border-bottom: 1px solid var(--border-subtle); white-space: nowrap; }
tbody tr[data-href] { cursor: pointer; }
tbody tr:hover td { background: rgba(255,255,255,.02); }
tbody tr.cursor td { background: rgba(212,151,90,.07); }
tbody tr.cursor td:first-child { box-shadow: inset 2px 0 0 var(--accent); }
.dim { color: var(--text-muted); }
.sec { color: var(--text-secondary); }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 8px; vertical-align: 1px; }
.s-active { background: var(--ok); box-shadow: 0 0 0 3px var(--ok-glow); }
.s-commissioned, .s-registered { background: var(--muted-dot); }
.s-suspended { background: var(--warn); box-shadow: 0 0 0 3px var(--warn-glow); }
.s-retired { background: transparent; border: 1px solid var(--muted-dot); }
.kind { font: 10px "JetBrains Mono"; letter-spacing: .08em; text-transform: uppercase; padding: 1px 6px; border-radius: 3px; border: 1px solid var(--border-default); color: var(--text-secondary); }
.kind.agent { color: var(--accent); border-color: rgba(212,151,90,.3); }
.pill { display: inline-block; padding: 0 8px; border-radius: 999px; border: 1px solid var(--border-default); background: var(--surface-default); font-size: 12px; margin: 2px 4px 2px 0; }
.pill.human { border-color: rgba(212,151,90,.4); color: var(--accent); text-decoration: none; }
.pill.off { opacity: .45; text-decoration: line-through; }

/* The file: a record with a folder tab and a file number. The one flourish kept. */
.file { position: relative; background: var(--surface-card); border: 1px solid var(--border-default); border-radius: 0 var(--radius-lg) var(--radius-lg) var(--radius-lg); padding: 18px 22px; margin-top: 22px; }
.file::before { content: attr(data-tab); position: absolute; top: -21px; left: -1px; height: 21px; padding: 0 12px; display: flex; align-items: center; background: var(--surface-card); border: 1px solid var(--border-default); border-bottom: 0; border-radius: var(--radius-md) var(--radius-md) 0 0; font: 500 10px "JetBrains Mono"; letter-spacing: .14em; color: var(--text-muted); text-transform: uppercase; }
.fileno { font: 500 11px "JetBrains Mono"; color: var(--text-muted); letter-spacing: .06em; }
.state { display: inline-flex; align-items: center; font: 500 11px "JetBrains Mono"; letter-spacing: .12em; text-transform: uppercase; padding: 3px 9px; border: 1px solid currentColor; border-radius: 4px; }
.state.active { color: var(--ok); } .state.suspended { color: var(--warn); } .state.retired, .state.commissioned { color: var(--text-muted); }
.verdict-mark { display: inline-block; font: 600 11px "JetBrains Mono"; letter-spacing: .14em; text-transform: uppercase; padding: 3px 10px; border: 1.5px solid currentColor; border-radius: 4px; }
.verdict-mark.yes { color: var(--ok); } .verdict-mark.no { color: var(--danger); }
.verdict-mark.land { animation: land .35s var(--spring); }
@keyframes land { from { transform: scale(1.35); opacity: 0; } }
.sealed { display: inline-block; height: 11px; background: #0a0a0d; border: 1px solid var(--border-default); border-radius: 2px; vertical-align: -1px; }

.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border-default); margin: 16px 0 18px; overflow-x: auto; }
.tabs a { padding: 8px 12px; color: var(--text-muted); text-decoration: none; font-size: 12.5px; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
.tabs a:hover { color: var(--text-primary); }
.tabs a.on { color: var(--text-primary); border-bottom-color: var(--accent); }
.tabs .n { font: 10px "JetBrains Mono"; color: var(--text-muted); margin-left: 5px; }
.grid2 { display: grid; grid-template-columns: 1.3fr 1fr; gap: 18px; align-items: start; }
.facts { display: grid; grid-template-columns: 150px 1fr; gap: 8px 14px; margin: 0; }
.facts dt { color: var(--text-muted); font-size: 12px; }
.facts dd { margin: 0; }
.card { background: var(--surface-card); border: 1px solid var(--border-default); border-radius: var(--radius-lg); padding: 14px 16px; }
.card + .card { margin-top: 12px; }
.card h2 { margin-bottom: 8px; }
.section-h { font: 500 10px "JetBrains Mono"; letter-spacing: .15em; text-transform: uppercase; color: var(--text-muted); margin: 20px 0 8px; display: flex; justify-content: space-between; align-items: center; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0; }
.row + .row { border-top: 1px solid var(--border-subtle); }
.note { color: var(--text-muted); font-size: 11.5px; }
.chain { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.chain .arr { color: var(--text-muted); font-size: 11px; }
ul.plain { margin: 0; padding-left: 18px; } ul.plain li { margin: 3px 0; }
.ver { font: 10.5px "JetBrains Mono"; color: var(--text-muted); border: 1px solid var(--border-default); border-radius: 3px; padding: 0 5px; }
.code { background: var(--surface-code); border: 1px solid var(--border-default); border-radius: var(--radius-md); padding: 12px 14px; font: 11.5px/1.7 "JetBrains Mono"; color: var(--text-secondary); white-space: pre-wrap; overflow-x: auto; }
.code .k { color: var(--accent); }
.mem { padding: 9px 0; }
.mem + .mem { border-top: 1px solid var(--border-subtle); }
.mem .meta { color: var(--text-muted); font-size: 11.5px; margin-top: 2px; display: flex; gap: 12px; flex-wrap: wrap; }
.tag { font: 10px "JetBrains Mono"; letter-spacing: .06em; padding: 0 5px; border-radius: 3px; border: 1px solid var(--border-default); color: var(--text-secondary); }
.tag.inf { color: var(--warn); border-color: rgba(251,191,36,.3); }
.tag.obs { color: var(--ok); border-color: rgba(116,181,132,.3); }
.timeline { border-left: 1px dashed var(--border-default); margin-left: 5px; padding-left: 16px; }
.tl { position: relative; padding: 4px 0 10px; }
.tl::before { content: ""; position: absolute; left: -20px; top: 10px; width: 7px; height: 7px; border-radius: 50%; background: var(--surface-hover); border: 1px solid var(--text-muted); }
.tl.now::before { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-glow); }
.tl .when { font: 11px "JetBrains Mono"; color: var(--text-muted); }
.check { border: 1px solid var(--border-default); border-radius: var(--radius-lg); padding: 14px; background: var(--surface-default); margin-top: 14px; }
.check .q { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.check select { background: var(--surface-code); border: 1px solid var(--border-default); border-radius: var(--radius-md); color: var(--text-primary); padding: 5px 8px; font: 12.5px "DM Sans"; }
.check .answer { min-height: 40px; display: flex; gap: 14px; align-items: center; margin-top: 12px; }
.check .why { color: var(--text-secondary); font-size: 12px; }

.drawer { position: fixed; top: 0; bottom: 0; right: 0; width: 440px; background: var(--glass-bg); backdrop-filter: blur(12px); border-left: 1px solid var(--border-default); box-shadow: var(--shadow-lg); transform: translateX(105%); transition: transform .34s var(--spring); padding: 22px; overflow: auto; z-index: 20; }
.dock-right .drawer { right: auto; left: 0; border-left: 0; border-right: 1px solid var(--border-default); transform: translateX(-105%); }
.drawer.open { transform: none; }
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.4); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 30; }
.scrim.open { opacity: 1; pointer-events: auto; }
.palette { position: fixed; left: 50%; top: 14vh; width: 560px; max-width: 92vw; transform: translate(-50%, -8px) scale(.98); opacity: 0; pointer-events: none; transition: all .22s var(--spring); background: var(--glass-bg); backdrop-filter: blur(12px); border: 1px solid var(--border-default); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); z-index: 31; overflow: hidden; }
.palette.open { opacity: 1; pointer-events: auto; transform: translate(-50%, 0) scale(1); }
.palette input { width: 100%; background: transparent; border: 0; border-bottom: 1px solid var(--border-default); padding: 14px 16px; color: var(--text-primary); font: 14px "DM Sans"; outline: none; }
.palette .grp { font: 500 10px "JetBrains Mono"; letter-spacing: .15em; text-transform: uppercase; color: var(--text-muted); padding: 10px 16px 4px; }
.palette .it { padding: 7px 16px; display: flex; justify-content: space-between; cursor: pointer; }
.palette .it.sel { background: rgba(212,151,90,.1); }
.palette .list { max-height: 50vh; overflow: auto; padding-bottom: 6px; }
.field { display: grid; gap: 4px; margin-top: 12px; }
.field label { font-size: 12px; color: var(--text-secondary); }
.field input, .field select, .field textarea { background: var(--surface-code); border: 1px solid var(--border-default); border-radius: var(--radius-md); color: var(--text-primary); padding: 7px 10px; font: 13px "DM Sans"; }
.field textarea { min-height: 96px; resize: vertical; line-height: 1.5; }
.toast { position: fixed; bottom: 18px; left: 50%; transform: translate(-50%, 20px); opacity: 0; transition: all .3s var(--spring); background: var(--surface-card); border: 1px solid var(--border-default); border-radius: 999px; padding: 6px 14px; font-size: 12px; box-shadow: var(--shadow-lg); z-index: 40; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.open-q { color: var(--accent); font: 10px "JetBrains Mono"; letter-spacing: .08em; border: 1px dashed rgba(212,151,90,.45); border-radius: 3px; padding: 0 5px; }
.set-grid { display: grid; grid-template-columns: 200px 1fr; gap: 24px; }
.set-nav a { display: block; padding: 6px 10px; border-radius: var(--radius-md); color: var(--text-muted); text-decoration: none; font-size: 12.5px; }
.set-nav a.on { background: var(--surface-hover); color: var(--text-primary); }
.set-row { display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 12px 0; }
.set-row + .set-row { border-top: 1px solid var(--border-subtle); }
.set-row .d { color: var(--text-muted); font-size: 12px; }
.rail .cnt { font: 10px "JetBrains Mono"; color: #17110b; background: var(--accent); border-radius: 8px; padding: 0 5px; margin-left: auto; }
.rail:not(.open) .cnt { position: absolute; top: 3px; right: 3px; font-size: 8.5px; padding: 0 3.5px; }
.rail.open .cnt + .kbd { margin-left: 6px; }
.svc { font: 10px "JetBrains Mono"; letter-spacing: .06em; padding: 0 6px; border-radius: 3px; border: 1px solid var(--border-default); color: var(--text-secondary); white-space: nowrap; }
.svc.built-in { color: var(--accent); border-color: rgba(212,151,90,.3); }
.enf { font-size: 12px; white-space: nowrap; }
.enf.enforcing { color: var(--ok); } .enf.registered { color: var(--warn); } .enf.awaiting { color: var(--text-muted); }
.meta-line { font: 11px "JetBrains Mono"; color: var(--text-muted); margin-top: 6px; display: flex; gap: 14px; flex-wrap: wrap; }
.answer-box { margin-top: 12px; }
.answer-box .answer { margin-top: 0; }
.pass { color: var(--ok); } .fail { color: var(--danger); }
.diff-add { color: var(--ok); } .diff-del { color: var(--danger); }
.rq { display: grid; grid-template-columns: 1fr auto; gap: 10px; }
table.wrap td { white-space: normal; }
.file { margin-top: 30px; }
.empty-note { border: 1px dashed var(--border-default); border-radius: var(--radius-lg); padding: 12px 14px; color: var(--text-secondary); font-size: 12.5px; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: opacity .15s !important; } }
/* v4: the dock (help or assistant, one at a time), explain mode, builders, graph, network. */
.dock { width: 0; flex: none; overflow: hidden; background: var(--surface-base); border-left: 1px solid var(--border-subtle); transition: width .32s var(--spring); }
.dock-right .dock { border-left: 0; border-right: 1px solid var(--border-subtle); }
.dock.open { width: 380px; }
.dock-in { width: 380px; height: 100%; display: flex; flex-direction: column; }
.dock-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 14px; border-bottom: 1px solid var(--border-subtle); }
.dock-body { flex: 1; overflow: auto; padding: 12px 14px; }
.dock-foot { border-top: 1px solid var(--border-subtle); padding: 10px 14px; }
.icon-btn { width: 26px; height: 26px; display: grid; place-items: center; border-radius: var(--radius-sm); color: var(--text-muted); }
.icon-btn:hover { background: var(--surface-hover); color: var(--text-primary); }
.concept { padding: 7px 8px; border-radius: var(--radius-md); cursor: pointer; }
.concept:hover { background: var(--surface-hover); }
.concept .t { font-size: 12.5px; } .concept .s { font-size: 11.5px; color: var(--text-muted); }
.sheet p { color: var(--text-secondary); font-size: 12.5px; line-height: 1.6; margin: 0 0 10px; }
.search { width: 100%; background: var(--surface-code); border: 1px solid var(--border-default); border-radius: var(--radius-md); color: var(--text-primary); padding: 6px 10px; font: 12.5px "DM Sans"; }
.xlayer { position: fixed; inset: 0; pointer-events: none; z-index: 25; }
.xm { pointer-events: auto; position: absolute; width: 18px; height: 18px; border-radius: 50%; background: var(--accent); color: #17110b; font: 600 10px "JetBrains Mono"; display: grid; place-items: center; box-shadow: 0 0 0 3px rgba(212,151,90,.18); animation: land .3s var(--spring); }
.xm:hover, .xm:focus-visible { transform: scale(1.15); }

.xcard b { font-weight: 500; display: block; margin-bottom: 3px; }
.xbar { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); pointer-events: auto; background: var(--glass-bg); backdrop-filter: blur(12px); border: 1px solid var(--border-default); border-radius: 999px; padding: 6px 8px 6px 14px; font-size: 12px; display: flex; gap: 10px; align-items: center; box-shadow: var(--shadow-lg); }
.xtarget { outline: 1.5px dashed var(--accent) !important; outline-offset: 3px; border-radius: 4px; }

.ctx { display: inline-flex; gap: 6px; align-items: center; font: 10.5px "JetBrains Mono"; color: var(--text-muted); border: 1px solid var(--border-default); border-radius: 999px; padding: 1px 8px; }
.composer { display: flex; gap: 8px; }

.split { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 18px; align-items: start; }
.preview { position: sticky; top: 0; }
.builder { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 18px; align-items: start; }
.listnav a { display: flex; justify-content: space-between; align-items: center; padding: 7px 10px; border-radius: var(--radius-md); color: var(--text-secondary); text-decoration: none; font-size: 12.5px; }
.listnav a.on { background: var(--surface-hover); color: var(--text-primary); box-shadow: inset 2px 0 0 var(--accent); }
.listnav a:hover { background: var(--surface-hover); }
.edit-list { display: grid; gap: 6px; }
.edit-list input, .inline-in { background: var(--surface-code); border: 1px solid var(--border-default); border-radius: var(--radius-md); color: var(--text-primary); padding: 6px 9px; font: 12.5px "DM Sans"; width: 100%; }
.chk { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border: 1px solid var(--border-default); border-radius: 999px; margin: 3px 4px 3px 0; font-size: 12px; cursor: pointer; user-select: none; }
.chk.on { border-color: rgba(212,151,90,.5); color: var(--accent); background: rgba(212,151,90,.07); }
.var { color: var(--accent); }
.path { font: 12px "JetBrains Mono"; }

}

let reqTab = 'access';
function approverOf(obj) { const root = S.grants.find(g => g.obj === obj && g.rel === 'owner' && byId(g.holder).kind === 'person' && standing(g).ok); return root ? root.holder : 'P-0001'; }
function viewRequests(tab) {
  rows = []; tab = tab || reqTab; reqTab = tab;
  const body = tab === 'access' ? `<table><thead><tr><th>Who</th><th>Asks for</th><th>For</th><th>Why</th><th>Approver</th><th>Asked</th><th>State</th><th></th></tr></thead><tbody>

  : `<table><thead><tr><th>Who</th><th>Wants to</th><th>Why</th><th>Approver</th><th>Asked</th><th>State</th><th></th></tr></thead><tbody>

    <p class="note" style="margin-top:10px">Some acts need a person each time, whatever the agent holds. The agent waits; the person answers here or from their phone.</p>`;
  return `<div class="page"><div class="eyebrow">Access</div><h1>Requests</h1><p class="sub">Asked by people and agents alike, through the screen or through their tools.</p>

const reqState = r => r.state === 'waiting' ? '<span style="color:var(--accent)">waiting</span>' : r.state === 'approved' ? `<span class="pass">approved</span>${r.note ? ` <span class="note">${esc(r.note)}</span>` : ''}` : `<span class="dim">declined</span>${r.note ? ` <span class="note">${esc(r.note)}</span>` : ''}`;

// ---------- Reviews: people confirm what their agents hold; orphans; standing rules.
function viewReviews() {
  rows = [];

      <div class="section-h" style="margin-top:0"><span>${S.review.title} · due ${S.review.due}</span><span class="note" style="letter-spacing:0;text-transform:none">${Object.keys(done).length} of ${due.length} decided</span></div>

    </div><div>
      <div class="card"><h2>No one answering</h2>${orphans().map(a => `<div class="row"><span>${pillFor(a.id)} <span class="note">${esc(nameOf(a.human))} is ${byId(a.human).state}</span></span><span><button class="btn" data-act="transfer" data-id="${a.id}">Hand over</button></span></div>`).join('') || '<div class="dim">Every agent has an active person.</div>'}

// ---------- Graph: who relates to what, laid out by a small force simulation.

function graphModel() {

    m.nodes.forEach(n => { n.vx += (W / 2 - n.x) * .004; n.vy += (H / 2 - n.y) * .004; n.x += Math.max(-12, Math.min(12, n.vx * k)); n.y += Math.max(-12, Math.min(12, n.vy * k)); n.vx *= .6; n.vy *= .6; n.x = Math.max(40, Math.min(W - 40, n.x)); n.y = Math.max(30, Math.min(H - 30, n.y)); });
  }
}
function viewGraph(focus) {

  const svg = `<svg viewBox="0 0 ${W} ${H}" id="gsvg">${m.edges.map(e => { const a = m.nodes[m.at[e.a]], b = m.nodes[m.at[e.b]], on = hot && hot.has(e.a) && hot.has(e.b); return `<line class="ge ${e.kind} ${hot ? (on ? 'hot' : 'dimmed') : ''}" x1="${a.x.toFixed(1)}" y1="${a.y.toFixed(1)}" x2="${b.x.toFixed(1)}" y2="${b.y.toFixed(1)}"><title>${e.label ? esc(nameOf(e.a)) + ' is ' + e.label + ' of ' + e.b : ''}</title></line>`; }).join('')}
    ${m.nodes.map(n => `<g class="gn ${hot && !hot.has(n.id) ? 'dimmed' : ''}" transform="translate(${n.x.toFixed(1)},${n.y.toFixed(1)})" data-gnode="${n.id}">${shape(n)}<text x="13" y="4">${esc(n.label)}</text></g>`).join('')}</svg>`;
  const side = gFocus ? (byId(gFocus) ? `<div class="node-card"><h2>${esc(nameOf(gFocus))}</h2><div class="note" style="margin:4px 0 8px">Highlighted: everything it can reach, and the grants that give it.</div>${reach(gFocus).map(e => `<a class="row" style="padding:6px 0;text-decoration:none;color:inherit;align-items:flex-start" href="#/resources/${e.r.id}"><span>${esc(e.r.type === 'project' || e.r.type === 'organisation' ? e.r.id : e.r.name)}<div style="margin-top:3px">${svcTag(svcOf(e.r))}${status(svcOf(e.r)) === 'enforcing' ? '' : ' <span class="enf registered">not enforced</span>'}</div></span><span class="mono dim" style="text-align:right">${e.ps.map(c => c.perm).join(', ')}</span></a>`).join('') || '<div class="dim">Nothing.</div>'}<div style="margin-top:10px;display:flex;gap:8px"><a class="btn" href="#/file/${gFocus}/access">Open file</a><a class="btn" href="#/graph">Clear</a></div></div>`
      : `<div class="node-card"><h2>${esc(resName(gFocus))}</h2><div class="note" style="margin:4px 0 8px">Highlighted: everyone who can reach it, and why.</div>${whoCan(gFocus).map(e => `<div class="row" style="padding:4px 0"><span>${pillFor(e.x.id)}</span><span class="mono dim">${e.ps.map(c => c.perm).join(', ')}</span></div>`).join('') || '<div class="dim">Nobody.</div>'}<div style="margin-top:10px;display:flex;gap:8px"><a class="btn" href="#/resources/${gFocus}">Open resource</a><a class="btn" href="#/graph">Clear</a></div></div>`)

    <div class="split" style="grid-template-columns:minmax(0,1fr) 300px"><div class="graph-wrap" style="height:calc(100vh - 170px);min-height:460px">${svg}

    <div>${side}</div></div></div>`;
}
document.addEventListener('click', e => { const n = e.target.closest('[data-gnode]'); if (n) location.hash = '#/graph/' + n.dataset.gnode; const s = e.target.closest('[data-gshow]'); if (s) { gShow[s.dataset.gshow] = !gShow[s.dataset.gshow]; route(); } });

<script>

    const lendable = s => s.owner === meId && !s.lend, mayLend = S.store.filter(lendable), cannot = S.store.filter(s => !lendable(s)), mine = S.ids.filter(b => b.kind === 'agent' && b.state === 'active' && b.human === meId);
    const whyNot = s => s.lend ? s.lend : s.scope === 'user' ? `personal to ${nameOf(s.owner)}; only its owner lends it` : `owned by ${nameOf(s.owner)}; ask them to lend it`;
    return drawer(dHead('Secrets', 'Issue a virtual credential', 'Stands in for a secret: one holder, acting for one person, with its own limits and lease.')
    + `<div class="field"><label>Made from</label><select id="iFrom">${mayLend.map(s => `<option>${esc(s.path)}</option>`).join('')}</select><div class="note">Secrets you own. Others below.</div></div>
      <div class="field"><label>Held by</label><select id="iTo">${mine.map(b => `<option value="${b.id}">${esc(b.name)}</option>`).join('')}</select><div class="note">Your own active agents.</div></div>
      <div class="field"><label>How</label><select id="iMode"><option>proxied: calls go through this service</option><option>short-lived token, minted per session</option><option>token exchanged per call</option></select></div>
      <div class="field"><label>Limits</label><input id="iLim" value="read only; $20 a month"></div><div class="field"><label>Lease</label><select id="iLease"><option>7 days</option><option>30 days</option><option>ends with assignment</option></select></div>
      <div class="note" style="margin-top:8px">It acts for you, ${esc(nameOf(meId))}.</div>
      <div class="card" style="margin-top:10px"><h2>What you can't lend</h2>${cannot.map(s => `<div class="why-not"><b>${esc(s.path)}</b><div class="note">${whyNot(s)}</div></div>`).join('') || '<div class="dim">Nothing.</div>'}</div>` + dButtons('Issue', 'issuedo'));
  }
  if (a === 'issuedo') { S.vcreds.push({ id: 'VC-' + (S.vcreds.length + 1), from: $('#iFrom').value, holder: $('#iTo').value, forWho: meId, mode: $('#iMode').value, limits: $('#iLim').value, lease: $('#iLease').value, uses: 0, state: 'active' }); bump(); closeAll(); location.hash = '#/secrets/virtual'; route(); return toast('Issued. The holder never sees the secret.'); }
  if (a === 'revlease') { const v = S.vcreds.find(z => z.id === el.dataset.v); v.state = 'revoked here; upstream pending'; v.revoked = `stopped issuing ${hhmm()}; upstream: pending`; route(); setTimeout(() => { v.revoked = `stopped issuing; upstream confirmed ${hhmm()}`; v.state = 'revoked'; if (/secrets/.test(location.hash)) route(); }, 1600); return toast('Stopped issuing. Waiting for the system behind it to confirm.'); }
  return actV3(a, el);
};
document.addEventListener('click', e => { const r = e.target.closest('[data-pickrel]'); if (r) { document.querySelectorAll('[data-pickrel]').forEach(z => z.classList.toggle('on', z === r)); } });

// ---------- The file gains a Start button; routes gain the new screens.
const viewFileV3 = viewFile;
viewFile = function (id, tab) { const x = byId(id); let h = viewFileV3(id, tab); if (x && x.kind === 'agent' && x.state === 'active') h = h.replace('<button class="btn danger" data-act="stop"', `<button class="btn primary" data-act="start" data-id="${id}">Start…</button><button class="btn danger" data-act="stop"`); return h; };
route = function () {
  let [, view, a, b] = (location.hash || '#/people').split('/');
  if (view === 'vault') view = 'secrets';
  document.querySelectorAll('.rail a').forEach(el => el.classList.toggle('on', el.dataset.nav === (view === 'file' ? 'people' : view)));
  const Vw = { file: () => viewFile(a, b), roles: () => viewRoles(a, b), resources: () => viewResources(a), access: () => viewAccess(a, b), requests: () => viewRequests(a), reviews: viewReviews, secrets: () => viewSecrets(a), connections: viewConnections, sessions: viewSessions, model: () => viewModel(a), settings: () => viewSettings(a), graph: () => viewGraph(a), network: viewNetwork, me: viewMe };
  $('#screen').innerHTML = (Vw[view] || viewPeople)();
  const nReq = S.requests.filter(r => r.state === 'waiting').length + S.acts.filter(q => q.state === 'waiting').length;
  const nRev = S.grants.filter(g => byId(g.holder).kind === 'agent' && g.live && byId(g.holder).state !== 'retired' && !S.review.done[g.id]).length;
  $('#cntReq').textContent = nReq || ''; $('#cntReq').style.display = nReq ? '' : 'none';
  $('#cntRev').textContent = nRev || ''; $('#cntRev').style.display = nRev ? '' : 'none';
  if (dockMode === 'assistant') renderDock();
};
// Keyboard: everything clickable that isn't a link or button is focusable and answers Enter and Space.
const KEYABLE = '[data-gnode], .concept, .chk, [data-share], [data-pickrel], [data-help], tr[data-href], tr[data-act]';
function keyable() { document.querySelectorAll(KEYABLE).forEach(e => { if (e.tabIndex < 0) e.tabIndex = 0; if (!e.getAttribute('role')) e.setAttribute('role', 'button'); }); }
new MutationObserver(keyable).observe(document.body, { childList: true, subtree: true });
document.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches(KEYABLE)) { e.preventDefault(); e.target.dispatchEvent(new MouseEvent('click', { bubbles: true })); } });
let xTimer; const remeasure = () => { if (!explaining) return; clearTimeout(xTimer); xTimer = setTimeout(() => { const l = $('#xlayer'); if (l) l.remove(); explaining = false; explainOn(); }, 120); };
addEventListener('scroll', remeasure, true); addEventListener('resize', remeasure);
applyShell(); route(); renderDock();
</script>
