[workspace]
members = [
    "crates/lys",
    "crates/lys-anchor",
    "crates/lys-anchor-cli",
    "crates/lys-core",
    "crates/lys-home",
    "crates/lys-identity",
    "crates/lys-identity-server",
    "crates/lys-log-store",
    "crates/lys-openapi",
    "crates/lys-secrets",
    "tests/identity_contract",
]
resolver = "3"

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/ablative-io/lys"
authors = ["Tom Whiting <tom@ablative.com.au>"]
rust-version = "1.85"

[workspace.dependencies]
# Internal
lys-core = { version = "0.2.0", path = "crates/lys-core" }
lys-home = { version = "0.2.0", path = "crates/lys-home" }
lys-identity = { version = "0.2.0", path = "crates/lys-identity" }
lys-identity-server = { version = "0.2.0", path = "crates/lys-identity-server" }
lys-log-store = { version = "0.2.0", path = "crates/lys-log-store" }
lys-openapi = { version = "0.2.0", path = "crates/lys-openapi" }

# Cryptographic primitives — pinned at the versions hardened in meridian-trust.
# This lineup is deliberate and boring: the trust layer speaks the verification
# world's lingua franca (SHA-256, Ed25519, RFC 6962) so third parties can verify
# with standard tooling. See docs/DESIGN.md "Primitive decisions".
aes-gcm = "0.10"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
ciborium = "0.2"
ct-merkle = "0.2"
ed25519-dalek = { version = "2", features = ["pkcs8", "serde"] }
hkdf = "0.12"
# Time zones from the database bundled in the build, never the system's, so one
# zone name gives the same offsets on every machine.
jiff = { version = "0.2", default-features = false, features = ["std", "tzdb-bundle-always"] }
postcard = { version = "1", features = ["alloc"] }
rand = "0.9"
rcgen = "0.13"
# Readiness events through a safe interface: kqueue on macOS and the BSDs,
# epoll on Linux, so a wait is on the kernel's notice and never a clock.
mio = { version = "1", default-features = false, features = ["os-ext"] }
# POSIX record locks through a safe interface: a lock the process owns, never
# shared with a child through a duplicated descriptor.
rustix = { version = "1.1", features = ["fs", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
thiserror = "2"
time = "0.3"
toml = { version = "0.9", default-features = false, features = ["parse", "serde", "std"] }
tracing = "0.1"
x25519-dalek = { version = "2", features = ["serde", "static_secrets"] }
x509-parser = "0.16"
zeroize = { version = "1", features = ["derive"] }

# The directory service. Each pinned, and TLS is rustls only.
axum = "=0.8.9"
openidconnect = { version = "=4.0.1", default-features = false, features = ["reqwest", "rustls-tls"] }
tokio = { version = "=1.53.1", features = ["macros", "net", "rt-multi-thread", "signal", "sync"] }
# The contract tests' HTTP client, the version openidconnect already carries, with no TLS.
reqwest = { version = "=0.12.28", default-features = false }

# The service's OpenAPI document: schemas derived from the route types,
# pinned, with the derive macros and nothing else.
utoipa = { version = "=5.5.0", default-features = false, features = ["macros"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# Dev
coset = "0.4"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
# Pedantic baseline. CI runs `clippy --all-targets -- -D warnings`, so every
# "warn" below is a hard merge gate, not advisory.
pedantic = { level = "warn", priority = -1 }

# Unwrap / Expect / Panic — forbidden in library code. Tests are exempt through
# clippy.toml's allow-unwrap-in-tests, allow-expect-in-tests and
# allow-panic-in-tests; a test file carries #![cfg(test)] as its first line.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
unimplemented = "warn"
todo = "warn"
unreachable = "warn"

# Cloning and allocation discipline
clone_on_ref_ptr = "warn"
redundant_clone = "warn"
cloned_instead_of_copied = "warn"
flat_map_option = "warn"
implicit_clone = "warn"

# Error handling
result_large_err = "warn"
map_err_ignore = "warn"

# Memory / performance
large_futures = "warn"
large_stack_arrays = "warn"
large_types_passed_by_value = "warn"
boxed_local = "warn"
vec_box = "warn"
rc_buffer = "warn"

# Code clarity
explicit_deref_methods = "warn"
explicit_into_iter_loop = "warn"
explicit_iter_loop = "warn"
manual_let_else = "warn"
match_bool = "warn"
match_same_arms = "warn"
match_wild_err_arm = "warn"
needless_pass_by_value = "warn"
trivially_copy_pass_by_ref = "warn"
unnecessary_wraps = "warn"
used_underscore_binding = "warn"
get_unwrap = "warn"
inefficient_to_string = "warn"
string_lit_as_bytes = "warn"
future_not_send = "warn"

# Deliberate allows — noise, not signal for this codebase
str_to_string = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_inception = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
too_many_lines = "allow"
struct_excessive_bools = "allow"
