# Run the Cargo build script and declare its package resources.
extra_srcs = ["**"]

# Cargo.toml development profile optimizes dependencies at level 3.
[buildscript.run]
rustc_link_lib = true
rustc_link_search = true

[buildscript.run.env]
OPT_LEVEL = "3"
DEBUG = "true"
PROFILE = "debug"
NUM_JOBS = "1"
