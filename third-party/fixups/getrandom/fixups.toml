# @generated by build//buck/buckgen from its fixup library (buck/buckgen/fixups);
# a checkout's own fixup is declared in buckgen.json _fixups with its reason.

# Files the crate reads at compile time beyond its Rust sources.
extra_srcs = ["README.md"]

# Cargo runs every build script and applies its link directives. OPT_LEVEL,
# DEBUG and PROFILE come from the build mode (cargo_buildscript.bzl).
[buildscript.run]
rustc_link_lib = true
rustc_link_search = true
